<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rainfall Logger</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-6 rounded-2xl shadow-xl w-full max-w-md">
        
        <!-- HEADER -->
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-blue-600">🌧️ Rainfall Logger</h1>
            <p class="text-sm text-gray-500">Monsoon Data Collection System</p>
        </div>

        <!-- LOGIN SCREEN -->
        <div id="loginScreen">
            <label class="block text-sm font-medium text-gray-700 mb-2">Enter Mobile Number</label>
            <input type="tel" id="phoneNumberInput" placeholder="e.g. 923001234567" 
                   class="w-full p-3 border border-gray-300 rounded-xl mb-4 focus:ring-2 focus:ring-blue-500 outline-none">
            <button onclick="handleLogin()" 
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl shadow-md transition">
                Log In
            </button>
            <p id="loginError" class="text-red-500 text-sm mt-3 text-center hidden"></p>
        </div>

        <!-- SUBMISSION FORM -->
        <div id="dataForm" class="hidden">
            
            <div class="bg-blue-50 p-4 rounded-xl mb-4 text-sm text-blue-800 space-y-1">
                <p>👤 <strong>User:</strong> <span id="displayPhone"></span></p>
                <p>📍 <strong>Station:</strong> <span id="displayStation"></span></p>
            </div>

            <!-- UTC SLOT SELECTION -->
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Target UTC Slot</label>
                <p class="text-xs text-gray-500 mb-2">Auto-selected to the slot that just ended. Change if reporting late.</p>
                <select id="slotSelect" class="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none bg-white font-semibold text-gray-700">
                    <option value="00:00 - 03:00 UTC">00:00 - 03:00 UTC</option>
                    <option value="03:00 - 06:00 UTC">03:00 - 06:00 UTC</option>
                    <option value="06:00 - 09:00 UTC">06:00 - 09:00 UTC</option>
                    <option value="09:00 - 12:00 UTC">09:00 - 12:00 UTC</option>
                    <option value="12:00 - 15:00 UTC">12:00 - 15:00 UTC</option>
                    <option value="15:00 - 18:00 UTC">15:00 - 18:00 UTC</option>
                    <option value="18:00 - 21:00 UTC">18:00 - 21:00 UTC</option>
                    <option value="21:00 - 00:00 UTC">21:00 - 00:00 UTC</option>
                </select>
            </div>

            <!-- RAINFALL INPUT -->
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-2">Rainfall Amount (mm)</label>
                <input type="number" step="0.1" id="rainfallInput" placeholder="e.g. 14.5" 
                       class="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-lg">
            </div>

            <button onclick="submitData()" id="submitBtn" 
                    class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-3 rounded-xl shadow-md transition">
                Submit Reading
            </button>

            <button onclick="logout()" class="w-full mt-3 text-xs text-gray-400 underline text-center block">
                Log out / Change Phone Number
            </button>

            <p id="statusMsg" class="text-sm mt-3 text-center font-medium p-2 rounded-xl hidden"></p>
        </div>

    </div>

    <script>
        // 1. YOUR GOOGLE APPS SCRIPT URL HERE
        const SCRIPT_URL = "https://script.googleusercontent.com/macros/echo?user_content_key=AUkAhnR134jNyYjKjDO2jGmZNMGE2llPmLdA4FUaSTpJIIbV5U60q9ExvJWgoEDh1MMtx-eAVp1lvHxzqLInC1Kv9sZalaWOzw-T3SCubyAbCqIo-1RK8IcADToEg5QZFjLTUtzvBZrbLaMRzkWTcsb7aAuaclH59v0YzX2FEr-npytmx8-Ci275h5w24H9PyDRuLg1eboiHtlHEWSkYQvD5KAP4GmDMXntU9NSok-7lZlkoBfUiwnUazhsAWHEp92E-0-Hn1ua7QDQv1SLgTPiiqTu0NHei_Q&lib=Mn9oQs4aZhtSmKpTqflkMHXVnVwvVYdKf";

        // 2. WORKER PHONE TO STATION MAPPING (Add all 21 phone numbers here)
        const WORKERS = {
            "923133764792": "Station 01 - Habib_Home",
            "923420474962": "Station 02 - Idasar_Home",
            "923131212478": "Station 03 - Kamran_Home",
			"923332214521": "Station 03 - Nizam_Home",
			
            // Add remaining workers...
        };

        // Auto-detect the 3-hour slot that just ended (e.g., at 00:27 UTC -> 21:00 - 00:00 UTC)
        function getRecentUTCSlot() {
            const now = new Date();
            const hour = now.getUTCHours();
            
            let endHour = Math.floor(hour / 3) * 3;
            let startHour = endHour - 3;

            if (startHour < 0) {
                startHour = 21;
                endHour = 0;
            }

            const startStr = String(startHour).padStart(2, '0') + ":00";
            const endStr = String(endHour).padStart(2, '0') + ":00";
            return `${startStr} - ${endStr} UTC`;
        }

        window.onload = function() {
            const savedPhone = localStorage.getItem("worker_phone");
            if (savedPhone && WORKERS[savedPhone]) {
                showDashboard(savedPhone);
            }
        };

        function handleLogin() {
            const phone = document.getElementById("phoneNumberInput").value.trim();
            const errorEl = document.getElementById("loginError");

            if (WORKERS[phone]) {
                localStorage.setItem("worker_phone", phone);
                errorEl.classList.add("hidden");
                showDashboard(phone);
            } else {
                errorEl.innerText = "❌ Phone number not registered.";
                errorEl.classList.remove("hidden");
            }
        }

        function showDashboard(phone) {
            document.getElementById("loginScreen").classList.add("hidden");
            document.getElementById("dataForm").classList.remove("hidden");

            document.getElementById("displayPhone").innerText = phone;
            document.getElementById("displayStation").innerText = WORKERS[phone];

            // Auto-select the slot that just finished
            const recentSlot = getRecentUTCSlot();
            document.getElementById("slotSelect").value = recentSlot;
        }

        function logout() {
            localStorage.removeItem("worker_phone");
            document.getElementById("dataForm").classList.add("hidden");
            document.getElementById("loginScreen").classList.remove("hidden");
        }

        async function submitData() {
            const phone = localStorage.getItem("worker_phone");
            const station = WORKERS[phone];
            const selectedSlot = document.getElementById("slotSelect").value;
            const rainfall = document.getElementById("rainfallInput").value;
            const statusMsg = document.getElementById("statusMsg");
            const submitBtn = document.getElementById("submitBtn");

            if (!rainfall || rainfall < 0 || rainfall > 300) {
                statusMsg.className = "text-red-600 bg-red-50 text-sm mt-3 text-center font-medium p-2 rounded-xl block";
                statusMsg.innerText = "Please enter a valid rain amount (0 - 300 mm).";
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerText = "Submitting...";
            statusMsg.classList.add("hidden");

            const payload = {
                timestamp: new Date().toISOString(),
                phone: phone,
                station: station,
                utc_slot: selectedSlot,
                rainfall: parseFloat(rainfall)
            };

            try {
                await fetch(SCRIPT_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                statusMsg.className = "text-green-700 bg-green-50 text-sm mt-3 text-center font-medium p-2 rounded-xl block";
                statusMsg.innerText = `✅ Recorded ${rainfall} mm for [${selectedSlot}]. (If previously entered, record was updated!)`;
                document.getElementById("rainfallInput").value = "";
            } catch (error) {
                statusMsg.className = "text-red-600 bg-red-50 text-sm mt-3 text-center font-medium p-2 rounded-xl block";
                statusMsg.innerText = "❌ Network error. Please try again.";
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "Submit Reading";
            }
        }
    </script>
</body>
</html>
